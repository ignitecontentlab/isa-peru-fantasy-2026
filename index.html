const $=id=>document.getElementById(id);

const escapeHTML=value=>String(value??"").replace(
  /[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
);

const normalize=value=>String(value||"")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .toLowerCase()
  .replace(/[^a-z]/g,"");

function readSaved(key,fallback){
  try{return JSON.parse(localStorage.getItem(key))??fallback}
  catch{return fallback}

  try{localStorage.setItem(key,JSON.stringify(value))}

function distance(a,b){
  let previous=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const current=[i];
    for(let j=1;j<=b.length;j++){
      current[j]=Math.min(
        previous[j]+1,
        current[j-1]+1,
        previous[j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
    previous=current;
  }
  return previous[b.length];
}

function matchSurfer(s,list){
  const name=normalize(s.name);
  const exact=list.find(x=>
    x.gender===s.gender && normalize(x.name)===name
  );
  if(exact)return exact;

  const candidates=list
    .filter(x=>x.gender===s.gender && x.country===s.country)
    .map(x=>({x,d:distance(name,normalize(x.name))}))
    .sort((a,b)=>a.d-b.d);

  if(
    candidates.length &&
    candidates[0].d<=Math.max(1,Math.floor(name.length*.1)) &&
    (!candidates[1] || candidates[0].d<candidates[1].d)
  )return candidates[0].x;

  return null;
}

function pointsFor(place){
  return Number.isInteger(place)&&place>0
    ? POINTS[place-1]??null
    : null;
}

function surferKey(s){
  return s.gender+"|"+normalize(s.name);
}

const defaults={
  ticker:"live",
  speed:100,
  message:"Welcome to isa surf · Peru Fantasy 2026",
  countdownTarget:0,

let rounds={M:[],W:[]};

for(const gender of ["M","W"]){

  if(old && Array.isArray(old.rounds)){

/*
Draw-derived elimination and place estimates.
Future empty heat slots do not count as completed appearances.
*/
function analyse(draw,gender){
  const people=new Map();

  for(const round of draw){
    for(const heat of round.heats||[]){
      for(const row of heat.rows||[]){
        if(!row.name)continue;

        const key=normalize(row.name);

        if(!people.has(key)){
          people.set(key,{
            name:row.name,
            country:row.country,
            gender,
            history:[]
          });
        }

        people.get(key).history.push({round,heat,row});
      }
    }
  }

  let removed=0;
  let precedingComplete=true;
  const estimatedPlaces=new Map();

  const repechages=draw
    .filter(r=>r.type==="repechage")
    .sort((a,b)=>a.number-b.number);

  for(const round of repechages){
    const heats=(round.heats||[]).filter(h=>h.rows?.length);

    const complete=heats.length && heats.every(h=>
      h.status==="completed" && h.rows.every(r=>r.place)
    );

    if(!complete){
      precedingComplete=false;
      continue;
    }

    if(!precedingComplete)continue;

    const thirds=heats.filter(h=>h.rows.length>=3).length;
    const fourths=heats.filter(h=>h.rows.length>=4).length;

    removed+=thirds+fourths;

    estimatedPlaces.set(round.name,{
      3:people.size-removed+1,
      4:people.size-removed+1+thirds
    });
  }

  return [...people.values()].map(person=>{
    const completed=person.history.filter(x=>
      x.heat.status==="completed" && x.row.place
    );

    const loss=completed.filter(x=>
      x.round.type==="repechage" && x.row.place>2
    ).at(-1);

    const final=completed.find(x=>x.round.type==="final");

    const latest=person.history.filter(x=>
      x.heat.status==="completed" || x.heat.status==="running"
    ).at(-1)||person.history[0];

    person.status="active";
    person.round=latest.round.label;
    person.place=null;
    person.basis="draw";

    if(final){
      person.status=final.row.place===1?"champion":"finished";
      person.place=final.row.place;
      person.basis="final heat";
    }else if(loss){
      person.status="eliminated";
      person.round=loss.round.label;
      person.place=estimatedPlaces.get(loss.round.name)?.[loss.row.place]??null;
      person.basis="estimate";
    }else if(
      latest.round.type==="repechage" ||
      latest.heat.status==="completed" && latest.row.place>2
    ){
      person.status="repechage";
    }

    person.points=pointsFor(person.place);
    delete person.history;
    return person;
  });
}

function applyManual(person){
  const record=manual[surferKey(person)];
  if(!record)return person;

  return {
    ...person,
    place:record.place,
    points:record.points??pointsFor(record.place),
    basis:"manual",
    status:["unknown","active","repechage"].includes(person.status)
      ?"finished"
      :person.status
  };
}

function compute(){
  const field=[
    ...analyse(rounds.M,"M"),
    ...analyse(rounds.W,"W")
  ].map(applyManual);

  const picks=PICKS.map(pick=>applyManual({
    ...pick,
    ...(matchSurfer(pick,field)||{
      status:"unknown",place:null,points:null
    }),
    owner:pick.owner,
    seed:pick.seed
  }));

  /*
  Projection uses known draft seeds only.
  Unseeded competitors sort after seeded competitors, alphabetically.
  This is a heuristic, not a complete-field statistical model.
  */
  for(const gender of ["M","W"]){
    const remaining=field
      .filter(s=>
        s.gender===gender &&
        !["eliminated","finished","champion"].includes(s.status)
      )
      .sort((a,b)=>{
        const sa=matchSurfer(a,PICKS)?.seed??9999;
        const sb=matchSurfer(b,PICKS)?.seed??9999;
        return sa-sb||a.name.localeCompare(b.name);
      });

    for(const pick of picks.filter(p=>p.gender===gender)){
      if(pick.place){
        pick.projectedPlace=pick.place;
        pick.projectedPoints=pick.points;
      }else if(pick.status==="eliminated"){
        pick.projectedPlace=null;
        pick.projectedPoints=null;
      }else{
        const index=remaining.findIndex(s=>
          normalize(s.name)===normalize(pick.name)
        );

        pick.projectedPlace=index<0?null:index+1;
        pick.projectedPoints=pointsFor(pick.projectedPlace);
      }
    }
  }

  const owners=[...new Set(PICKS.map(p=>p.owner))];

  const teams=owners.map(owner=>{
    const rows=picks.filter(p=>p.owner===owner);
    const sum=list=>list.reduce((total,p)=>total+(p.points??0),0);

    return {
      owner,
      rows,
      known:rows.filter(p=>p.status!=="unknown").length,
      out:rows.filter(p=>p.status==="eliminated").length,
      alive:rows.filter(p=>["active","repechage"].includes(p.status)).length,
      settled:rows.filter(p=>p.points!=null).length,
      total:sum(rows),
      men:sum(rows.filter(p=>p.gender==="M")),
      women:sum(rows.filter(p=>p.gender==="W")),
      projected:rows.every(p=>p.projectedPoints!=null)
        ?rows.reduce((total,p)=>total+p.projectedPoints,0)
        :null
    };
  });

  return {field,picks,teams};
}

const ownerTag=owner=>owner
  ?'<span class="owner">'+escapeHTML(owner)+'</span>'
  :"—";

const statusNames={
  active:"In draw",
  repechage:"Repechage",
  eliminated:"Out",
  finished:"Finished",
  champion:"Champion",
  unknown:"Not matched"
};

function statusTag(status){
  return '<span class="state '+escapeHTML(status)+'">'+
    escapeHTML(statusNames[status]||status)+'</span>';
}

function suffix(person){
  return person.basis==="estimate"?"*":person.basis==="manual"?"†":"";
}

function placeText(person){
  return person.place==null?"—":person.place+suffix(person);
}

function pointText(person){
  return person.points==null?"—":person.points+suffix(person);
}

function table(headers,rows){
  return '<div class="scroll"><table><thead><tr>'+
    headers.map(h=>"<th>"+h+"</th>").join("")+
    "</tr></thead><tbody>"+
    (rows.join("")||'<tr><td colspan="'+headers.length+
      '" class="note">No records available yet.</td></tr>')+
    "</tbody></table></div>";
}

const scoringNote=`
<p class="note">
* Draw-derived place and points estimates are provisional.
† Manually recorded finish.
Team total is the sum of five personal placing-point scores, not heat totals.
The configured points table and inferred placements need verification before payouts.
Projected standings are an unofficial seed-order illustration, not win probabilities.
</p>`;

function rankTeams(teams,key){
  const list=[...teams].sort((a,b)=>
    (b[key]??-1)-(a[key]??-1)||a.owner.localeCompare(b.owner)
  );

  let previous=null,position=0;

  return list.map((team,index)=>{
    if(index===0||team[key]!==previous)position=index+1;
    previous=team[key];

    return {
      ...team,
      rank:position,
      tied:list.some(other=>other!==team&&other[key]===team[key])
    };
  });
}

function chips(team){
  return team.rows.map(person=>`
    <span class="chip ${person.status}">
      ${escapeHTML(person.name)}
      <b>${person.place?placeText(person):
        person.projectedPlace?"~"+person.projectedPlace:"—"}</b>
      ${person.points!=null?pointText(person):""}
    </span>
  `).join("");
}

function standings(data,projection=false){
  const projected=projection||teamSort==="projected";
  const teams=rankTeams(data.teams,projected?"projected":"total");

  let html=`
    <div class="row">
      <h2>${projection?"Projected team order":"Fantasy team standings"}</h2>
      ${projection?"":'<button id="sort">Sort: '+
        (projected?"projected":"settled points")+"</button>"}
    </div>`;

  html+=teams.map(team=>`
    <article class="team">
      <div class="rank">${
        team.known&&(projected?team.projected!=null:team.settled)
          ?(team.tied?"T":"")+team.rank:"—"
      }</div>
      <div>
        ${ownerTag(team.owner)}
        <small class="meta">
          ${team.alive} alive · ${team.out} out · ${team.known}/5 matched
        </small>
      </div>
      <div class="total">
        ${team.known?team.total:"—"}<small>settled*</small>
      </div>
      <div class="total proj">
        ${team.projected??"—"}<small>projected</small>
      </div>
      <div class="chips">${chips(team)}</div>
    </article>
  `).join("");

  if(!projection){
    html+='<div class="grid" style="margin-top:12px">';

    for(const gender of ["M","W"]){
      const best=data.teams.map(team=>({
        owner:team.owner,
        surfer:team.rows.filter(p=>p.gender===gender&&p.place)
          .sort((a,b)=>a.place-b.place)[0]
      })).sort((a,b)=>
        (a.surfer?.place??999)-(b.surfer?.place??999)
      );

      html+='<section class="card"><h2>'+
        (gender==="M"?"Men's":"Women's")+" best finishes</h2>"+
        table(["Owner","Finish*","Best surfer"],best.map(record=>`
          <tr>
            <td>${ownerTag(record.owner)}</td>
            <td class="place">${record.surfer?placeText(record.surfer):"—"}</td>
            <td class="name">${escapeHTML(record.surfer?.name||"No finish recorded")}</td>
          </tr>
        `))+"</section>";
    }

    html+="</div>";
  }else{
    html+=`
      <p class="note">
      Placed surfers retain their recorded points.
      Surviving competitors are ordered using the draft seeds available in this file;
      unseeded competitors sort last alphabetically.
      Missing points withhold a complete team projection.
      </p>
      <div class="grid">`;

    for(const gender of ["M","W"]){
      const rows=data.picks.filter(p=>p.gender===gender)
        .sort((a,b)=>(a.projectedPlace??999)-(b.projectedPlace??999));

      html+='<section class="card"><h2>'+
        (gender==="M"?"Men":"Women")+" projected places</h2>"+
        table(["Place","Surfer","Owner","Points"],rows.map(p=>`
          <tr>
            <td class="place">${p.place?placeText(p):
              p.projectedPlace?"~"+p.projectedPlace:"—"}</td>
            <td class="name">${escapeHTML(p.name)}</td>
            <td>${ownerTag(p.owner)}</td>
            <td class="num">${p.projectedPoints??"—"}</td>
          </tr>
        `))+"</section>";
    }

    html+="</div>";
  }

  return html+scoringNote;
}
