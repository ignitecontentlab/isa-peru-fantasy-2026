name: collect
on:
  schedule: [{cron: "2-59/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: collect
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python collector/collect_isa.py
      - run: |
          git config user.name "collector"; git config user.email "bot@users.noreply.github.com"
          git add -A data; git diff --cached --quiet || (git commit -m "data update" && git push)
